[project]
name = "blt25"
version = "0.2.0"
description = "Implementation of Boneh-Laufer-Tas: Threshold Batch Identity-based Encryption without Epochs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "mpmath>=1.3"]

[project.optional-dependencies]
# exact-basis mode (MG02 ToBasis over q-ary lattices) needs FLINT
exact = ["python-flint>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "stat: statistical distribution tests",
]
