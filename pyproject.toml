[project]
name = "blt25"
version = "0.1.0"
description = "Implementation of Boneh-Laufer-Tas: Threshold Batch Identity-based Encryption without Epochs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "mpmath>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "stat: statistical distribution tests",
]
